; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM11
monitor_port = COM11
upload_speed = 921600
monitor_speed = 921600
lib_deps = 
	madhephaestus/ESP32Servo@^1.2.1
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi

[env:data_acquisition]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
upload_port = ${common.upload_port}
monitor_port = ${common.monitor_port}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
board_upload.flash_size = ${common.board_upload.flash_size}
board_build.partitions = ${common.board_build.partitions}
board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}
monitor_dtr = 0
monitor_rts = 0
build_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
build_src_filter =
	+<*>
	-<main.cpp>
	-<servo_controller.cpp>
	+<data_acquisition.cpp>
lib_deps = madhephaestus/ESP32Servo@^3.0.9

[env:real_time_inference]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
upload_port = ${common.upload_port}
monitor_port = ${common.monitor_port}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
board_upload.flash_size = ${common.board_upload.flash_size}
board_build.partitions = ${common.board_build.partitions}
board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}
lib_deps = 
	${common.lib_deps}
	madhephaestus/ESP32Servo@^3.0.9
monitor_dtr = 0
monitor_rts = 0
build_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
build_src_filter = 
	+<*>
	-<data_acquisition.cpp>
	+<main.cpp>

[env:esp32-s3-n16r8]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
upload_port = ${common.upload_port}
monitor_port = ${common.monitor_port}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
board_upload.flash_size = ${common.board_upload.flash_size}
board_build.partitions = ${common.board_build.partitions}
board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}
build_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_USB_MODE=1
lib_deps = madhephaestus/ESP32Servo@^3.0.9
