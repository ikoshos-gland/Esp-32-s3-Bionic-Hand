; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================================
; COMMON SETTINGS - Tüm environment'lar için ortak ayarlar
; ============================================================================
[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM7
monitor_port = COM7
upload_speed = 115200
monitor_speed = 115200

; N16R8 Hardware Configuration
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi  ; Flash Quad IO, PSRAM Octal IO

; ============================================================================
; ENVIRONMENT 1: DATA ACQUISITION (Veri Toplama)
; ============================================================================
; Kullanım: pio run -e data_acquisition -t upload
; Amaç: 6 EMG sensöründen veri toplama, seri port üzerinden gönderme
; Özellikler: TFLite yok, hızlı derleme, küçük binary boyutu
; ============================================================================
[env:data_acquisition]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
upload_port = ${common.upload_port}
monitor_port = ${common.monitor_port}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
board_upload.flash_size = ${common.board_upload.flash_size}
board_build.partitions = ${common.board_build.partitions}
board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDATA_ACQUISITION_MODE  ; Data acquisition mode flag

build_src_filter =
    +<*>
    -<main.cpp>              ; Exclude real-time inference main
    +<data_acquisition.cpp>  ; Include data acquisition main

; No external libraries needed - only uses Arduino.h (built-in)

; ============================================================================
; ENVIRONMENT 2: REAL-TIME INFERENCE (Gerçek Zamanlı Sınıflandırma)
; ============================================================================
; Kullanım: pio run -e real_time_inference -t upload
; Amaç: TFLite model ile gerçek zamanlı el jesti sınıflandırması
; Özellikler: TFLite Micro, TD4 features, 11 gesture classes
; ============================================================================
[env:real_time_inference]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
upload_port = ${common.upload_port}
monitor_port = ${common.monitor_port}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
board_upload.flash_size = ${common.board_upload.flash_size}
board_build.partitions = ${common.board_build.partitions}
board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DREAL_TIME_INFERENCE_MODE  ; Real-time inference mode flag

; TensorFlowLite_ESP32 is in lib/ folder (local library)
; No external dependencies needed from PlatformIO registry

; ============================================================================
; LEGACY ENVIRONMENT (Geriye dönük uyumluluk)
; ============================================================================
[env:esp32-s3-n16r8]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
upload_port = ${common.upload_port}
monitor_port = ${common.monitor_port}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
board_upload.flash_size = ${common.board_upload.flash_size}
board_build.partitions = ${common.board_build.partitions}
board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Legacy environment - uses real-time inference (main.cpp)
; TensorFlowLite_ESP32 is in lib/ folder
