; PlatformIO Project Configuration File
; ESP32-S3 DevKitC-1 (N16R8): 16 MB flash, 8 MB Octal PSRAM
;
; Environments
;   data_acquisition    streams filtered, bipolar-encoded EMG at 1000 Hz for training
;   real_time_inference TFLite Micro classifier + servo hand
;
; Both environments sample at 1000 Hz and use the same filter coefficients
; (include/filter_coefficients_50hz.h). Do not define FILTER_SAMPLING_2000HZ
; unless you also retrain on 2000 Hz data.

[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM11
monitor_port = COM11
upload_speed = 921600
monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
; One servo library version for every environment
lib_deps =
    madhephaestus/ESP32Servo@^3.0.9

[env:data_acquisition]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
upload_port = ${common.upload_port}
monitor_port = ${common.monitor_port}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
board_upload.flash_size = ${common.board_upload.flash_size}
board_build.partitions = ${common.board_build.partitions}
board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}
build_flags =
    ${common.build_flags}
    -DDATA_ACQUISITION_MODE
build_src_filter =
    +<*>
    -<main.cpp>
    -<functions.cpp>
    -<servo_controller.cpp>
    +<data_acquisition.cpp>
lib_deps = ${common.lib_deps}
; TFLite is not needed for data acquisition
lib_ignore = TensorFlowLite_ESP32

[env:real_time_inference]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
upload_port = ${common.upload_port}
monitor_port = ${common.monitor_port}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
monitor_dtr = ${common.monitor_dtr}
monitor_rts = ${common.monitor_rts}
board_upload.flash_size = ${common.board_upload.flash_size}
board_build.partitions = ${common.board_build.partitions}
board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}
build_flags =
    ${common.build_flags}
    -DREAL_TIME_INFERENCE_MODE
build_src_filter =
    +<*>
    -<data_acquisition.cpp>
lib_deps = ${common.lib_deps}
